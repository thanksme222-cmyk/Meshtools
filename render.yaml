services:
  # 1. The Web Service (API)
  - type: web
    name: meshtools-api
    runtime: node
    plan: standard
    buildCommand: cd meshtools-backend && npm install
    startCommand: cd meshtools-backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: meshtools-cache
          property: connectionString
      - key: FRONTEND_URL
        value: https://meshtools.org

  # 2. The Background Worker (BullMQ Consumer)
  - type: worker
    name: meshtools-worker
    runtime: node
    plan: standard
    buildCommand: cd meshtools-backend && npm install
    startCommand: cd meshtools-backend && node worker.js
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: meshtools-cache
          property: connectionString
      - key: BACKEND_URL
        fromService:
          type: web
          name: meshtools-api
          property: host

  # 3. Managed Redis Instance
  - type: redis
    name: meshtools-cache
    plan: free
    ipAllowList: []